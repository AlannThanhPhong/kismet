<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">Thiệp mời cưới Mai Anh và Quang Sơn · 06.12.2026</title>
  <desc id="desc">Thiệp cưới nền xanh Dark Olive Green (#556B2F) với khung ren trắng cổ điển và hoa lá màu nước, mời dự tiệc cưới ngày 06 tháng 12 năm 2026 tại Diamond Place.</desc>
  <defs>
