    </pattern>
  </defs>
  <rect width="720" height="960" fill="#556B2F"/>
  <!-- Outer scalloped lace frame -->
  <rect x="64" y="76" width="592" height="808" rx="18" fill="url(#laceMesh)" stroke="#f8f9f1" stroke-width="3"/>
  <rect x="78" y="90" width="564" height="780" rx="10" fill="none" stroke="#f8f9f1" stroke-width="2" stroke-dasharray="3 7"/>
  <!-- Inner warm ivory card -->
